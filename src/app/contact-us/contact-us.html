<section class="bg-gray-50 py-16 px-4">
  <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-xl p-8 md:p-12 border border-gray-100">
    
    <h2 class="text-3xl font-bold text-gray-900 mb-8">Send us a Message</h2>

    <form class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name *</label>
          <input type="text" placeholder="Full Name" 
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-900 focus:border-transparent outline-none transition">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Email *</label>
          <input type="email" placeholder="Email" 
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-900 focus:border-transparent outline-none transition">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Phone No *</label>
          <div class="flex">
            <span class="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-xl">
              🇮🇳
            </span>
            <input type="tel" 
              class="w-full px-4 py-3 rounded-r-lg border border-gray-300 focus:ring-2 focus:ring-blue-900 focus:border-transparent outline-none transition">
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Service Interest *</label>
          <select class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white focus:ring-2 focus:ring-blue-900 outline-none transition appearance-none cursor-pointer">
            <option value="" disabled selected>Select a service</option>
            <option>Advisory & Consulting</option>
            <option>Build</option>
            <option>Run</option>
            <option>Upgrade</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Company name</label>
        <input type="text" placeholder="Your Company Name" 
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-900 focus:border-transparent outline-none transition">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Message *</label>
        <textarea rows="4" placeholder="Tell us about.." 
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-900 focus:border-transparent outline-none transition"></textarea>
      </div>

      <div class="flex justify-center pt-4">
        <button type="submit" 
          class="bg-[#00084d] text-white px-16 py-4 rounded-full font-bold text-lg hover:bg-blue-950 transition-all duration-300 shadow-lg">
          Send Message
        </button>
      </div>
    </form>
    
  </div>
</section>
