<div class="timeline-wrapper">
  <div class="connector-line"></div>

  @for (step of solutionSteps; track step.title) {
    <div class="step-row">
      <div class="icon-circle">
        <img [src]="step.icon" [alt]="step.title">
      </div>
      
      <div class="content-bar" [style.background-color]="step.color">
        <h3>{{ step.title }}</h3>
        <ul>
          @for (point of step.points; track point) {
            <li>{{ point }}</li>
          }
        </ul>
      </div>
    </div>
  }
</div>
