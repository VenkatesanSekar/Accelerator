<div class="max-w-7xl mx-auto px-4 py-16">
  <div class="mb-12">
    <h2 class="text-4xl font-bold text-[#000048]">Your journey at Accelerator starts with {{steps.length}} steps!</h2>
    <p class="text-gray-600 mt-4 max-w-3xl">To help you move through the application process with ease, here's a simple overview of our candidate journey.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
    
    <div class="relative overflow-hidden rounded-lg shadow-xl">
      <img [src]="steps[currentStep()].image" 
           class="w-full h-[400px] object-cover transition-opacity duration-500" 
           [alt]="steps[currentStep()].title">
    </div>

    <div class="space-y-6">
      <h3 class="text-5xl font-bold text-[#000048]">{{steps[currentStep()].title}}</h3>
      <p class="text-lg text-gray-700 leading-relaxed">
        {{steps[currentStep()].description}}
      </p>

      <div class="flex items-center gap-6 pt-8">
        <div class="flex gap-4">
          <button (click)="prev()" [disabled]="currentStep() === 0" 
                  class="p-2 border-2 border-blue-600 rounded-full text-blue-600 disabled:opacity-30 hover:bg-blue-50">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          </button>
          <button (click)="next()" [disabled]="currentStep() === steps.length - 1" 
                  class="p-2 border-2 border-blue-600 rounded-full text-blue-600 disabled:opacity-30 hover:bg-blue-50">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </button>
        </div>

        <div class="flex gap-2">
          @for (step of steps; track $index) {
            <div [class]="'h-3 w-3 rounded-full transition-all ' + ($index === currentStep() ? 'bg-[#000048] w-6' : 'bg-gray-300')"></div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
