<section class="relative h-screen flex items-center px-12 overflow-hidden bg-white">
  
  <div *ngFor="let slide of slides; let i = index" 
       class="absolute inset-0 flex flex-col lg:flex-row items-center justify-between px-12 transition-all duration-1000 ease-in-out"
       [ngClass]="i === currentIndex ? 'opacity-100 translate-x-0' : 'opacity-0 translate-x-10 pointer-events-none'">
    
    <div class="lg:w-1/2 z-10">
      <h1 class="text-6xl font-bold text-blue-950 leading-tight mb-6">
        {{ slide.title }}
      </h1>
      <p class="text-gray-600 text-xl mb-8 max-w-lg">
        {{ slide.description }}
      </p>
      <button class="bg-cyan-400 text-white px-8 py-3 rounded-lg font-bold shadow-lg">
        Learn More
      </button>
    </div>

    <div class="lg:w-1/2 relative h-[500px] flex justify-center items-center">
      <div class="iii-container">
        <div class="iii-bar" *ngFor="let b of [1,2,3]">
          <div class="moving-bg" [style.backgroundImage]="'url(' + slide.image + ')'"></div>
        </div>
        <div class="iii-top">
          <div class="moving-bg" [style.backgroundImage]="'url(' + slide.image + ')'"></div>
        </div>
      </div>
    </div>
  </div>
</section>
